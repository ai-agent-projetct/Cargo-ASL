name: Cargo ASL tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-root
          MYSQL_DATABASE: cargo_asl
          MYSQL_USER: cargo_ci
          MYSQL_PASSWORD: ephemeral-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pephemeral-ci-root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure disposable CI database
        run: |
          cat > .env <<'ENV'
          HOST=127.0.0.1
          PORT=3000
          MYSQL_HOST=127.0.0.1
          MYSQL_PORT=3306
          MYSQL_DATABASE=cargo_asl
          MYSQL_USER=cargo_ci
          MYSQL_PASSWORD=ephemeral-ci-only
          ADMIN_EMAIL=ci-admin@cargoasl.invalid
          ADMIN_PASSWORD=ephemeral-ci-admin-only
          ENV
      - run: npm run db:init
      - run: npm run demo:seed
      - name: Start application
        run: |
          npm start > /tmp/cargo-asl.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/cargo-asl.log
          exit 1
      - run: npm run test:integration
      - run: npm run test:portals
      - run: npm run test:workflow
      - run: npm run demo:workspace
      - run: npm run demo:workspace
